<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Lovelyn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Anti-Copy Protection */
        body { 
            user-select: none; 
            -webkit-user-select: none; 
            background: #fdf6f6;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Animation & Design */
        .choice-card {
            cursor: pointer;
            padding: 40px;
            background: white;
            border-radius: 20px;
            width: 260px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .choice-card:hover {
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 20px 30px rgba(214, 128, 128, 0.2);
        }

        .icon { transition: transform 0.4s ease; display: inline-block; }
        .choice-card:hover .icon { transform: rotate(10deg) scale(1.2); }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <div id="hub" class="text-center">
        <h1 class="text-4xl font-light mb-4 text-stone-700 italic">For Lovelyn</h1>
        <p class="text-stone-500 mb-8">Choose a path</p>
        
        <div class="flex flex-wrap justify-center gap-8 px-4">
            <div class="choice-card" onclick="window.location.href='project3.html'">
                <div class="text-5xl mb-4 icon">💌</div>
                <h3 class="text-lg font-semibold text-stone-700">Favor Letter</h3>
            </div>

            <div class="choice-card" onclick="window.location.href='project1.html'">
                <div class="text-5xl mb-4 icon">✉️</div>
                <h3 class="text-lg font-semibold text-stone-700">Message Letter</h3>
            </div>

            <div class="choice-card" onclick="window.location.href='project2.html'">
                <div class="text-5xl mb-4 icon">🚲</div>
                <h3 class="text-lg font-semibold text-stone-700">Journey ride before</h3>
            </div>
        </div>
    </div>

    <script>
        // Prevent keyboard shortcuts for copying
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's')) e.preventDefault();
        });
    </script>
</body>
</html>
