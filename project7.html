<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miming Museum Gallery</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Museum Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e5ded2;
            overflow-x: hidden;
            margin: 0;
            user-select: none;
        }

        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        /* Dotted textured museum wall background */
        .museum-wall-bg {
            background-color: #eee3d3;
            background-image: 
                radial-gradient(#baa892 0.8px, transparent 0.8px),
                radial-gradient(ellipse at 50% 30%, rgba(255, 253, 245, 0.7) 0%, rgba(230, 218, 200, 0.4) 60%, rgba(190, 175, 155, 0.5) 100%);
            background-size: 18px 18px, 100% 100%;
            background-position: 0 0, 0 0;
        }

        /* Framed artwork styling with warm depth */
        .art-frame-box {
            background: #8B5A2B;
            border-radius: 4px;
            box-shadow: 
                0 18px 25px -5px rgba(0, 0, 0, 0.25),
                0 8px 10px -6px rgba(0, 0, 0, 0.2),
                inset 0 0 0 4px #523417,
                inset 0 0 0 10px #c69956,
                inset 0 0 0 14px #3b220d;
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Hover animation for paintings */
        .art-link-group:hover .art-frame-box {
            transform: translateY(-8px) scale(1.025);
            box-shadow: 
                0 25px 35px -5px rgba(0, 0, 0, 0.35),
                0 0 20px 2px rgba(212, 160, 23, 0.35),
                inset 0 0 0 4px #5c3817,
                inset 0 0 0 10px #e2b36a,
                inset 0 0 0 14px #42260f;
        }

        .canvas-inset-shadow {
            box-shadow: inset 2px 2px 8px rgba(0,0,0,0.45);
        }

        /* Floor baseboard styling */
        .museum-floor-trim {
            background: linear-gradient(to bottom, #bd834b 0%, #9e6430 20%, #613711 100%);
            box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.35);
            border-top: 6px solid #4a2808;
        }

        /* Star shimmer effect */
        @keyframes sparkleAnim {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.25) rotate(15deg); }
        }
        .star-sparkle {
            animation: sparkleAnim 2.5s infinite ease-in-out;
        }
    </style>
</head>
