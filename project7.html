<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Blossoming Bouquet</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --stem-color: #2e6f40;
            
            /* Flower-specific color gradients */
            --pink-petal: linear-gradient(to top, #a78bfa, #f472b6);
            --blue-petal: linear-gradient(to top, #3b82f6, #60a5fa);
            --white-petal: linear-gradient(to top, #cbd5e1, #ffffff);
            
            /* Glow shadows matching petal colors */
            --pink-glow: 0 0 15px rgba(244, 114, 182, 0.6);
            --blue-glow: 0 0 15px rgba(96, 165, 250, 0.6);
            --white-glow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            perspective: 1000px;
        }

        .night {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #070a13, #111827);
            z-index: 1;
        }

        .flowers {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transform: scale(0.9);
            width: 100%;
            height: 100%;
        }

        .flower {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
        }

        /* --- Individual Flower Settings (Positions & Angles) --- */
        
        /* 1. Center Pink Flower */
        .flower--pink {
            transform: translateX(-50%) scale(1);
            animation: sway-center 4s ease-in-out infinite alternate;
        }
        .flower--pink .flower__petal {
            background: var(--pink-petal);
            box-shadow: var(--pink-glow);
        }

        /* 2. Left Blue Flower */
        .flower--blue {
            transform: translateX(-180px) scale(0.85) rotate(-10deg);
            animation: sway-left 4.5s ease-in-out infinite alternate;
        }
        .flower--blue .flower__petal {
            background: var(--blue-petal);
            box-shadow: var(--blue-glow);
        }
        .flower--blue .flower__line {
            height: 50vmin;
        }

        /* 3. Right White Flower */
        .flower--white {
            transform: translateX(80px) scale(0.9) rotate(8deg);
            animation: sway-right 3.5s ease-in-out infinite alternate;
        }
        .flower--white .flower__petal {
            background: var(--white-petal);
            box-shadow: var(--white-glow);
        }
        .flower--white .flower__line {
            height: 48vmin;
        }

        /* --- Flower Components --- */

        .flower__line {
            width: 8px;
            height: 55vmin;
            background-image: linear-gradient(to top, rgba(0,0,0,0), var(--stem-color));
            box-shadow: 0 0 10px rgba(46, 111, 64, 0.4);
            transform-origin: bottom center;
        }

        /* Leaves setup */
        .flower__line__leaf {
            position: absolute;
            width: 20px;
            height: 40px;
            background: var(--stem-color);
            border-radius: 0 100px 0 100px;
            opacity: 0;
            transform: scale(0);
            transition: all 1.5s ease;
        }

        .flower__line__leaf--1 { 
            top: 40%; 
            left: 6px; 
            transform-origin: bottom left; 
            border-radius: 0 100px 0 100px; 
        }
        .flower__line__leaf--2 { 
            top: 55%; 
            right: 6px; 
            transform-origin: bottom right; 
            border-radius: 100px 0 100px 0; 
        }

        /* Centers */
        .flower__center {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 32px;
            height: 32px;
            background-color: #fef08a;
            border-radius: 50%;
            box-shadow: 0 0 25px #fef08a;
            z-index: 5;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.8s;
        }

        .flower__petals {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .flower__petal {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 38px;
            height: 75px;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            transform: translate(-50%, 0) scale(0);
            opacity: 0;
            transition: all 1.5s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        /* Rotations for full structural blooms */
        .flower__petal--1 { transform: translate(-50%, 0) scale(0) rotate(0deg); transition-delay: 0.2s; }
        .flower__petal--2 { transform: translate(-50%, 0) scale(0) rotate(72deg); transition-delay: 0.4s; }
        .flower__petal--3 { transform: translate(-50%, 0) scale(0) rotate(144deg); transition-delay: 0.6s; }
        .flower__petal--4 { transform: translate(-50%, 0) scale(0) rotate(216deg); transition-delay: 0.8s; }
        .flower__petal--5 { transform: translate(-50%, 0) scale(0) rotate(288deg); transition-delay: 1s; }

        /* --- Interactive Bloom Triggers --- */
        body:not(.not-loaded) .flower__petal {
            opacity: 1;
        }
        body:not(.not-loaded) .flower__petal--1 { transform: translate(-50%, 0) scale(1) rotate(0deg); }
        body:not(.not-loaded) .flower__petal--2 { transform: translate(-50%, 0) scale(1) rotate(72deg); }
        body:not(.not-loaded) .flower__petal--3 { transform: translate(-50%, 0) scale(1) rotate(144deg); }
        body:not(.not-loaded) .flower__petal--4 { transform: translate(-50%, 0) scale(1) rotate(216deg); }
        body:not(.not-loaded) .flower__petal--5 { transform: translate(-50%, 0) scale(1) rotate(288deg); }

        body:not(.not-loaded) .flower__center {
            transform: translate(-50%, -50%) scale(1);
        }

        body:not(.not-loaded) .flower__line__leaf {
            opacity: 1;
            transform: scale(1);
        }

        /* --- Sways Keyframes --- */
        @keyframes sway-center {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1) rotate(2deg); }
        }
        @keyframes sway-left {
            0% { transform: translateX(-180px) scale(0.85) rotate(-13deg); }
            100% { transform: translateX(-180px) scale(0.85) rotate(-7deg); }
        }
        @keyframes sway-right {
            0% { transform: translateX(80px) scale(0.9) rotate(5deg); }
            100% { transform: translateX(80px) scale(0.9) rotate(11deg); }
        }
    </style>
</head>
<body class="not-loaded">

    <!-- Background Audio Element -->
    <audio id="bg-music" src="f.mp3" loop></audio>

    <div class="night"></div>
    
    <div class="flowers">
        <!-- 1. LEFT BLUE FLOWER -->
        <div class="flower flower--blue">
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
            </div>
            <div class="flower__center"></div>
            <div class="flower__petals">
                <div class="flower__petal flower__petal--1"></div>
                <div class="flower__petal flower__petal--2"></div>
                <div class="flower__petal flower__petal--3"></div>
                <div class="flower__petal flower__petal--4"></div>
                <div class="flower__petal flower__petal--5"></div>
            </div>
        </div>

        <!-- 2. CENTER PINK FLOWER -->
        <div class="flower flower--pink">
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
            </div>
            <div class="flower__center"></div>
            <div class="flower__petals">
                <div class="flower__petal flower__petal--1"></div>
                <div class="flower__petal flower__petal--2"></div>
                <div class="flower__petal flower__petal--3"></div>
                <div class="flower__petal flower__petal--4"></div>
                <div class="flower__petal flower__petal--5"></div>
            </div>
        </div>

        <!-- 3. RIGHT WHITE FLOWER -->
        <div class="flower flower--white">
            <div class="flower__line">
                <div class="flower__line__leaf flower__line__leaf--1"></div>
                <div class="flower__line__leaf flower__line__leaf--2"></div>
            </div>
            <div class="flower__center"></div>
            <div class="flower__petals">
                <div class="flower__petal flower__petal--1"></div>
                <div class="flower__petal flower__petal--2"></div>
                <div class="flower__petal flower__petal--3"></div>
                <div class="flower__petal flower__petal--4"></div>
                <div class="flower__petal flower__petal--5"></div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Trigger blooming animation
            setTimeout(() => {
                document.body.classList.remove("not-loaded");
            }, 600);

            // Handle background music autoplay
            const audio = document.getElementById("bg-music");
            
            audio.play().catch(() => {
                // If browser blocks autoplay, start music on first click/tap
                const startAudio = () => {
                    audio.play();
                    document.removeEventListener("click", startAudio);
                    document.removeEventListener("touchstart", startAudio);
                };
                document.addEventListener("click", startAudio);
                document.addEventListener("touchstart", startAudio);
            });
        });
    </script>
</body>
</html>
